name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Codegen drift gate
        run: npm run check:drift
      - name: Evidence integrity gate
        run: npm run check:evidence
      - name: Red-team arithmetic gate
        run: npm run check:redteam
      - name: Quote audit gate
        run: npm run check:quotes
      - name: Commercial evidence gate
        run: npm run check:commercial
      - name: Vocabulary classifier gate
        run: npm run check:vocabulary
      - name: Commercial page gate
        run: npm run check:pages
      - name: Production build
        run: npm run build
