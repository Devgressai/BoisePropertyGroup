<div class="section" id="206.1">
<h4 data-hierarchy-metadata='{"path":"/current/title-24/section-206.1","citation":"24 CFR 206.1"}'>§ 206.1 Purpose.</h4>
<p>The purposes of the Home Equity Conversion Mortgage (HECM) Insurance program are set out in section 255(a) of the National Housing Act, Public Law 73-479, 48 Stat. 1246 (<a href="https://www.govinfo.gov/link/uscode/12/1715z-20" class="usc external" target="_blank" rel="noopener noreferrer">12 U.S.C. 1715z-20</a>) (“NHA”).</p>
